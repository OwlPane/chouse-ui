# Merge upstream daun-gatal/chouse-ui into OwlPane/main via PR (keeps fork current).
name: Sync upstream CHouse UI

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/daun-gatal/chouse-ui.git || true
          git fetch upstream main
          git checkout -B sync/upstream-chouse-ui
          if git merge --no-edit upstream/main; then
            echo "merged_clean=true" >> "$GITHUB_ENV"
          else
            git merge --abort
            echo "merged_clean=false" >> "$GITHUB_ENV"
            echo "::warning::Merge conflicts — resolve manually."
            exit 1
          fi

      - name: Push branch and open PR
        if: env.merged_clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push -f origin sync/upstream-chouse-ui
          existing=$(gh pr list --head sync/upstream-chouse-ui --json number -q '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh pr create --base main --head sync/upstream-chouse-ui \
              --title "chore: sync upstream CHouse UI" \
              --body "Automated merge from [daun-gatal/chouse-ui](https://github.com/daun-gatal/chouse-ui) main."
          fi
