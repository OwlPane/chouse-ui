# OwlPane: build ghcr.io/owlpane/chouse-ui from this fork (not upstream daun-gatal images).
name: OwlPane Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "charts/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: owlpane-chouse-ui-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  HELM_VALUES_HETZNER: helm-overrides/owlpane-chouse-ui/values-hetzner.yaml
  GIT_EMAIL: github-actions@github.com
  GIT_USERNAME: GitHub Actions

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: GHCR + GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/chouse-ui" >> "$GITHUB_ENV"

      - name: Compute image tag
        id: release_version
        run: |
          VERSION="$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute build metadata
        id: meta
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.release_version.outputs.version }}
            COMMIT_SHA=${{ steps.meta.outputs.commit_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release_version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Checkout seo-infra
        id: checkout_infra
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: balaji-singh/seo-infra
          path: seo-infra
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Update image tag in seo-infra
        if: steps.checkout_infra.outcome == 'success'
        working-directory: seo-infra
        run: |
          yq -i ".image.tag = \"${{ steps.release_version.outputs.version }}\"" "${{ env.HELM_VALUES_HETZNER }}"
          yq -i ".image.digest = \"\"" "${{ env.HELM_VALUES_HETZNER }}"

      - name: Commit and push seo-infra
        if: steps.checkout_infra.outcome == 'success'
        working-directory: seo-infra
        run: |
          git config user.email "${{ env.GIT_EMAIL }}"
          git config user.name "${{ env.GIT_USERNAME }}"
          git add "${{ env.HELM_VALUES_HETZNER }}"
          git diff --staged --quiet || \
            (git commit -m "chore(chouse-ui): image tag ${{ steps.release_version.outputs.version }}" && git push)

      - name: Skip GitOps sync (missing GIT_TOKEN)
        if: steps.checkout_infra.outcome != 'success'
        run: echo "::warning::GIT_TOKEN not set or seo-infra checkout failed; image pushed but Argo will not auto-sync."
